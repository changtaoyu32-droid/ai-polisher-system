<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能降低AI系统 - 精密学术文本润色优化平台</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

  <!-- 导航栏 -->
  <header>
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 21L14.907 18m4.917-4.917l-4.917 4.917M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm14.022-4.178a.75.75 0 00-1.06 0L9.71 13.328 7.29 10.907a.75.75 0 10-1.06 1.06l2.95 2.95a.75.75 0 001.06 0l6.022-6.022a.75.75 0 000-1.06z" />
      </svg>
      <span>智能降低AI系统</span>
    </div>
    <div class="header-actions">
      <!-- 历史记录按钮 -->
      <div style="position: relative;">
        <button class="btn-icon" id="btn-history" title="历史记录">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </button>
        <div class="history-dropdown" id="history-dropdown">
          <!-- 历史记录列表 -->
        </div>
      </div>
      <!-- 主题切换按钮 -->
      <button class="btn-icon" id="btn-theme" title="切换主题">
        <svg id="theme-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="18" height="18">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
        </svg>
      </button>
      <!-- API 配置按钮 -->
      <button class="btn-icon" id="btn-api-config" title="API 配置">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="18" height="18">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.43l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.991l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.645-.869l.214-1.28z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- 工作区 -->
  <main>
    <!-- 精致中部控制条 (策略模式 + 推荐标签 + 智能降重改写) 一行化排布，腾出黄金高度给文本框 -->
    <div class="controller-bar" style="border: none; padding: 0.5rem 0; margin-bottom: 0.25rem;">
      <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; flex: 1;">
        <div class="role-selector" style="display: flex; align-items: center; gap: 0.5rem;">
          <label for="role-select" style="font-weight: 600; font-size: 0.85rem; min-width: 65px; color: var(--text-muted);">策略模式:</label>
          <select id="role-select">
            <!-- 动态生成 6 个选项 -->
          </select>
        </div>
        <!-- 动态渲染选中策略的推荐查重系统标签 -->
        <div class="role-card-tags" id="active-role-tags" style="margin-top: 0; display: flex; align-items: center; gap: 0.35rem;"></div>
      </div>
      <!-- 智能降重改写核心主按钮 -->
      <button class="btn-primary" id="btn-convert" style="padding: 0.75rem 2.2rem; font-size: 0.92rem; border-radius: 8px;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" width="16" height="16">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 21L14.907 18m4.917-4.917l-4.917 4.917M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12z" />
        </svg>
        <span>智能降重改写</span>
      </button>
    </div>

    <!-- 文本输入输出栅格 -->
    <div class="workspace-grid">
      <!-- 左：原文输入 -->
      <div class="glass-panel">
        <div class="panel-header">
          <div class="panel-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 01-2.25 2.25M16.5 7.5V18a2.25 2.25 0 002.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 002.25 2.25h13.5M6 7.5h3v3H6v-3z" />
            </svg>
            <span>学术原文</span>
          </div>
          <div class="panel-actions">
            <button class="btn-secondary" id="btn-clear-source">清空</button>
            <button class="btn-secondary" id="btn-paste-source">粘贴</button>
          </div>
        </div>
        <div class="text-area-wrapper">
          <textarea id="source-text" placeholder="输入需要润色的学术论文、技术文档等，支持大段长句..."></textarea>
        </div>
        <div class="text-footer">
          <span id="source-char-count">0 字</span>
        </div>
      </div>

      <!-- 右：改写输出 -->
      <div class="glass-panel">
        <div class="panel-header">
          <div class="panel-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>优化改写</span>
          </div>
          <div class="panel-actions">
            <button class="btn-secondary active" id="btn-view-normal">纯文本</button>
            <button class="btn-secondary" id="btn-view-diff">修改对比</button>
            <button class="btn-secondary" id="btn-copy-target">一键复制</button>
          </div>
        </div>
        <div class="text-area-wrapper">
          <div class="output-render" id="target-render"></div>
        </div>
        <div class="text-footer">
          <span id="target-char-count">0 字</span>
          <span id="char-status-badge"></span>
        </div>
      </div>
    </div>

    <!-- 数据指标统计区 -->
    <div class="analysis-panel">
      <!-- 1. 修改率指标 -->
      <div class="metric-card">
        <div class="metric-info">
          <span class="metric-label">修改去重率 (L-Dist)</span>
          <span class="metric-value" id="val-modify-rate">0%</span>
        </div>
        <div class="progress-ring-wrapper">
          <svg class="progress-ring" width="52" height="52">
            <circle class="progress-ring-circle-bg" stroke-width="3" fill="transparent" r="23" cx="26" cy="26"/>
            <circle class="progress-ring-circle" id="circle-modify" stroke-width="3" stroke-dasharray="144.51" stroke-dashoffset="144.51" fill="transparent" r="23" cx="26" cy="26"/>
          </svg>
          <div class="progress-ring-text" id="ring-modify-text">0%</div>
        </div>
      </div>

      <!-- 2. AI概率预测变化 -->
      <div class="metric-card">
        <div class="metric-info">
          <span class="metric-label">预估 AI 概率值</span>
          <span style="font-size: 0.8rem; margin-top: 4px; display: inline-flex; align-items: center; gap: 6px;">
            <span style="color: var(--color-danger); text-decoration: line-through;" id="val-ai-before">95%</span>
            <span style="color: var(--text-muted);">➔</span>
            <span style="color: var(--color-success); font-weight: 700;" id="val-ai-after">15%</span>
          </span>
        </div>
        <div>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="32" height="32" style="stroke: var(--text-muted);">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
          </svg>
        </div>
      </div>

      <!-- 3. 字数比例监控 -->
      <div class="metric-card" id="metric-char-diff">
        <div class="metric-info">
          <span class="metric-label">字数合理性检测 (修改后/原文)</span>
          <span class="metric-value" id="val-char-ratio">0%</span>
        </div>
        <div id="char-status-indicator">
          <span class="badge-success">待输入</span>
        </div>
      </div>
    </div>
  </main>

  <!-- API 配置侧滑抽屉 -->
  <div class="drawer-backdrop" id="api-drawer-backdrop">
    <div class="drawer">
      <div class="drawer-header">
        <h3>API 参数配置</h3>
        <button class="btn-icon" id="btn-close-drawer">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="form-group">
        <label for="api-endpoint">API 端点 (Base URL)</label>
        <input type="text" id="api-endpoint" placeholder="例如: https://api.deepseek.com">
      </div>

      <div class="form-group">
        <label for="api-key">API Key</label>
        <input type="password" id="api-key" placeholder="填入以激活云端大模型转换">
      </div>

      <div class="form-group">
        <label for="api-model">模型名称 (Model)</label>
        <input type="text" id="api-model" placeholder="例如: deepseek-v4-flash">
      </div>

      <div class="form-group">
        <label for="api-temp">重写温度 (Temperature): <span id="val-temp">0.6</span></label>
        <input type="range" id="api-temp" min="0.1" max="1.5" step="0.05" value="0.6">
      </div>

      <div style="font-size: 0.78rem; background: var(--bg-input); border: 1px solid var(--border-color); padding: 0.8rem; border-radius: 8px; line-height: 1.45; color: var(--text-muted);">
        💡 <b>关于隐私：</b> API 密钥直接存储在您的本地浏览器 (localStorage)，不经过任何第三方服务器中转，保障学术机密安全。
      </div>

      <div style="font-size: 0.78rem; background: rgba(59, 130, 246, 0.05); border: 1px solid rgba(59, 130, 246, 0.12); padding: 0.8rem; border-radius: 8px; line-height: 1.45; color: var(--text-main);">
        📞 <b>获取 API 配置协助：</b><br/>
        如在使用云端大模型降AI时需要协助，或需要咨询定制 API 连接服务，请添加微信联系我：<b style="color: var(--border-color-active); letter-spacing: 0.5px;">17777259536</b>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="btn-save-config" style="flex: 1; justify-content: center;">确定</button>
        <button class="btn-secondary" id="btn-clear-config">重置</button>
      </div>
    </div>
  </div>

  <!-- 通知气泡 -->
  <div class="toast" id="toast-notify">
    <span>操作成功</span>
  </div>

  <!-- 引入主逻辑 -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
